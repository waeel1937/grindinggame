<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grinding Game (p5.js)</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>
<script>
let roughness = 0.15;
let angle = 0;
let pressure = 1.0;
let radius = 100;

function setup() {
  createCanvas(800, 600);
  angleMode(DEGREES);
}

function draw() {
  background(0);
  
  // Draw the base cylinder
  push();
  translate(width/2, height/2);
  stroke(255);
  noFill();
  ellipse(0, 0, radius * 2, radius * 2);
  
  // Draw imperfections as roughness effect
  stroke(255, 0, 0);
  beginShape();
  for (let a = 0; a < 360; a += 5) {
    let imperfection = roughness * 20 * noise(a * 0.1, frameCount * 0.01);
    let r = radius + imperfection;
    let x = r * cos(a);
    let y = r * sin(a);
    vertex(x, y);
  }
  endShape(CLOSE);
  
  // Draw grinding tool
  let toolX = (radius + 30) * cos(angle);
  let toolY = (radius + 30) * sin(angle);
  fill(0, 200, 255);
  noStroke();
  ellipse(toolX, toolY, 20, 20);
  pop();
  
  // UI
  fill(255);
  textSize(16);
  text(`Roughness: ${roughness.toFixed(3)}`, 20, 30);
  text(`Pressure: ${pressure.toFixed(1)}`, 20, 50);
  text(`Angle: ${angle}°`, 20, 70);
}

function keyPressed() {
  if (keyCode === LEFT_ARROW) {
    angle = (angle - 5) % 360;
  } else if (keyCode === RIGHT_ARROW) {
    angle = (angle + 5) % 360;
  } else if (keyCode === UP_ARROW) {
    pressure = min(pressure + 0.1, 5.0);
  } else if (keyCode === DOWN_ARROW) {
    pressure = max(pressure - 0.1, 0);
  } else if (key === ' ') {
    grind();
  }
}

function grind() {
  // Simulate grinding effect
  roughness = max(roughness - 0.005 * pressure, 0.01);
}
</script>
</body>
</html>
