<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CNC Grinding Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            color: #ccc;
            font-family: sans-serif;
            text-align: center;
        }

        #game {
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h1>CNC Grinding Simulator</h1>
    <div id="game"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 900,
            height: 650,
            backgroundColor: '#2e2e2e',
            parent: 'game',
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        let graphics;
        let statusBox;
        let sparks = [];

        const INITIAL_ROUGHNESS = 0.15;
        const TARGET_ROUGHNESS = 0.01;
        let grinding = false;
        let grindingAngle = 0;
        let grindingPressure = 1.0;
        let roughness = INITIAL_ROUGHNESS;

        const imperfections = [];

        const game = new Phaser.Game(config);

        function preload() { }

        function create() {
            graphics = this.add.graphics();

            // Status Box
            statusBox = this.add.text(20, 20, '', {
                color: '#ffffff',
                fontSize: '18px',
                backgroundColor: '#444',
                padding: { x: 10, y: 10 },
                fixedWidth: 250
            });

            // Imperfections init
            for (let angle = 0; angle < 360; angle += 5) {
                let magnitude = Phaser.Math.Between(8, 20);
                imperfections.push({ angle: angle, magnitude: magnitude });
            }

            // Controls
            this.input.keyboard.on('keydown-LEFT', () => {
                grindingAngle = (grindingAngle - 5 + 360) % 360;
            });
            this.input.keyboard.on('keydown-RIGHT', () => {
                grindingAngle = (grindingAngle + 5) % 360;
            });
            this.input.keyboard.on('keydown-UP', () => {
                grindingPressure = Math.min(grindingPressure + 0.1, 5.0);
            });
            this.input.keyboard.on('keydown-DOWN', () => {
                grindingPressure = Math.max(grindingPressure - 0.1, 0.1);
            });
            this.input.keyboard.on('keydown-SPACE', () => {
                grinding = !grinding;
            });
        }

        function update() {
            graphics.clear();

            const centerX = 450;
            const centerY = 325;
            const radius = 120;

            // Draw CNC Base Plate
            graphics.fillStyle(0x333333, 1);
            graphics.fillRect(centerX - 200, centerY + 150, 400, 20);

            // Draw Cylinder (metal)
            graphics.lineStyle(8, 0x888888);
            graphics.strokeCircle(centerX, centerY, radius);

            // Draw imperfections (bumps)
            imperfections.forEach(imp => {
                let angleRad = Phaser.Math.DegToRad(imp.angle);
                let impRadius = radius + imp.magnitude;
                let x = centerX + impRadius * Math.cos(angleRad);
                let y = centerY + impRadius * Math.sin(angleRad);
                graphics.fillStyle(0xbbbbbb, 1);
                graphics.fillCircle(x, y, 3);
            });

            // Grinding tool
            let toolRad = Phaser.Math.DegToRad(grindingAngle);
            let toolX = centerX + (radius + 60) * Math.cos(toolRad);
            let toolY = centerY + (radius + 60) * Math.sin(toolRad);

            // Tool arm
            graphics.lineStyle(4, 0xaaaaaa);
            graphics.beginPath();
            graphics.moveTo(toolX, toolY);
            graphics.lineTo(toolX + 60 * Math.cos(toolRad), toolY + 60 * Math.sin(toolRad));
            graphics.strokePath();

            // Grinding head
            graphics.fillStyle(grinding ? 0xff3333 : 0x00ccff, 1);
            graphics.fillCircle(toolX, toolY, 12);

            // Sparks (if grinding)
            if (grinding) {
                imperfections.forEach(imp => {
                    let diff = Math.abs(Phaser.Math.Angle.WrapDegrees(imp.angle - grindingAngle));
                    if (diff < 15) {
                        imp.magnitude = Math.max(imp.magnitude - 0.15 * grindingPressure, 0);

                        // Add sparks
                        for (let i = 0; i < 2; i++) {
                            sparks.push({
                                x: centerX + (radius + imp.magnitude) * Math.cos(Phaser.Math.DegToRad(imp.angle)),
                                y: centerY + (radius + imp.magnitude) * Math.sin(Phaser.Math.DegToRad(imp.angle)),
                                dx: Phaser.Math.Between(-3, 3),
                                dy: Phaser.Math.Between(-3, 3),
                                life: Phaser.Math.Between(10, 30)
                            });
                        }
                    }
                });
                // Update roughness
                let total = imperfections.reduce((sum, imp) => sum + imp.magnitude, 0);
                roughness = total / imperfections.length / 100;
            }

            // Draw sparks
            sparks.forEach(spark => {
                graphics.fillStyle(0xffcc00, 1);
                graphics.fillCircle(spark.x, spark.y, 2);
                spark.x += spark.dx;
                spark.y += spark.dy;
                spark.life--;
            });
            sparks = sparks.filter(s => s.life > 0);

            // Update status box
            statusBox.setText(
                `Grinding: ${grinding ? 'ON' : 'OFF'}\n` +
                `Angle: ${grindingAngle}°\n` +
                `Pressure: ${grindingPressure.toFixed(1)}\n` +
                `Roughness: ${roughness.toFixed(4)}\n\n` +
                `Controls:\n← → Rotate\n↑ ↓ Pressure\nSPACE Start/Stop`
            );
        }
    </script>
</body>
</html>
