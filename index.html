<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grinding Game Online</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="status">Loading game, please wait...</div>
    <canvas id="canvas" width="800" height="600"></canvas>

    <script type="module">
        import { main } from "https://pygame-web.github.io/pygame-wasm/pygame/pygame.js";
        main({
            canvas: document.getElementById("canvas"),
            scriptUrl: "grinding_game.py",
            onRuntimeInitialized: () => {
                document.getElementById("status").remove();
            }
        });
    </script>
</body>
</html>
